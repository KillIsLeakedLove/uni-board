<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务清单</title>
<script>
  try {
    const saved = localStorage.getItem('task-board.theme');
    document.documentElement.dataset.theme =
      saved === 'dark' || saved === 'light'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (err) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7;
    --panel: #ffffff;
    --panel-hover: #f7f8fa;
    --text: #1f2328;
    --muted: #8a909c;
    --border: #e5e8ee;
    --input-border: #c9cfd9;
    --accent: #4f6ef7;
    --accent-hover: #415cdc;
    --accent-soft: #eef2ff;
    --danger: #e5484d;
    --danger-soft: #fdeeee;
    --drop-line: #e5484d;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    --focus-ring: rgba(93, 114, 246, .15);
    --pill-todo-bg: #eceff3;
    --pill-todo-text: #667085;
    --pill-doing-bg: #fdf0dc;
    --pill-doing-text: #a96400;
    --pill-done-bg: #e3f5ea;
    --pill-done-text: #1f7a44;
    --done-text: #8b929e;
    --grid-line: rgba(79, 110, 247, .16);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121418;
    --panel: #1b1e24;
    --panel-hover: #23262e;
    --text: #e5e7eb;
    --muted: #8b93a1;
    --border: #2b303a;
    --input-border: #3a4150;
    --accent: #5b78ff;
    --accent-hover: #4a66e6;
    --accent-soft: #232a44;
    --danger: #ff6b70;
    --danger-soft: #3a2024;
    --drop-line: #ff6b70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --focus-ring: rgba(91, 120, 255, .25);
    --pill-todo-bg: #2a2f39;
    --pill-todo-text: #aab2c0;
    --pill-doing-bg: #3a2d18;
    --pill-doing-text: #eab45f;
    --pill-done-bg: #173a28;
    --pill-done-text: #5fd190;
    --done-text: #7c8492;
    --grid-line: rgba(91, 120, 255, .2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .15s, color .15s;
  }

  .topbar {
    max-width: 1800px;
    margin: 0 auto;
    padding: 28px 20px 18px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .topbar-text {
    flex: 1;
    min-width: 0;
  }

  .topbar h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: .5px;
  }

  .topbar-actions {
    display: flex;
    gap: 8px;
    padding-top: 2px;
  }

  .ghost-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s;
  }

  .ghost-btn:hover { background: var(--panel-hover); }

  .ghost-btn:disabled {
    opacity: .45;
    cursor: default;
  }

  .app {
    max-width: 1800px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .board {
    padding-bottom: 16px;
    overflow-x: auto;
  }

  .panel-list {
    position: relative;
    min-width: 1080px;
  }

  .panel-list > .panel {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* 12 栏背景板：用背景渐变绘制栏缝细线，不产生任何布局节点 */
  .panel-list::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity .18s ease;
    background-image: repeating-linear-gradient(
      to right,
      var(--grid-line) 0 1px,
      transparent 1px var(--grid-step, 148px)
    );
    background-position-x: -8px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent);
  }

  .panel-list.grid-active::before { opacity: 1; }

  body.panel-resizing,
  body.panel-resizing * {
    cursor: ew-resize !important;
    user-select: none;
  }

  body.panel-resizing-y,
  body.panel-resizing-y * {
    cursor: ns-resize !important;
    user-select: none;
  }
  .panel {
    background: var(--panel);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    min-height: 160px;
    container-type: inline-size;
  }

  /* 面板左右边缘的调宽手柄：悬停出现，不占布局 */
  .panel-resize {
    position: absolute;
    top: 12px;
    bottom: 12px;
    width: 12px;
    display: grid;
    place-items: center;
    cursor: ew-resize;
    opacity: 0;
    transition: opacity .12s;
    z-index: 2;
    touch-action: none;
  }

  .panel-resize::before {
    content: "";
    width: 3px;
    height: 28px;
    border-radius: 2px;
    background: var(--input-border);
    transition: background .12s;
  }

  .panel:hover > .panel-resize,
  .panel.resizing > .panel-resize { opacity: 1; }

  .panel-resize:hover::before { background: var(--accent); }

  /* 手柄贴在边缘内侧，避免探出面板把滚动区撑宽 */
  .panel-resize-left { left: 0; }
  .panel-resize-right { right: 0; }

  /* 便签底部调高手柄 */
  .panel-resize-bottom {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 0;
    height: 12px;
    display: grid;
    place-items: center;
    cursor: ns-resize;
    opacity: 0;
    transition: opacity .12s;
    z-index: 2;
    touch-action: none;
  }

  .panel-resize-bottom::before {
    content: "";
    width: 36px;
    height: 3px;
    border-radius: 2px;
    background: var(--input-border);
    transition: background .12s;
  }

  .panel:hover > .panel-resize-bottom,
  .panel.resizing-y > .panel-resize-bottom { opacity: 1; }

  .panel-resize-bottom:hover::before { background: var(--accent); }

  .panel.resizing-y {
    outline: 1px solid var(--accent);
    z-index: 3;
  }

  .panel.resizing {
    outline: 1px solid var(--accent);
    z-index: 3;
  }

  .panel.note-panel { min-height: 0; }

  .note-body {
    width: 100%;
    flex: none;
    min-height: 80px;
    margin-top: 2px;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: var(--panel-hover);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
  }

  .note-body::placeholder { color: var(--muted); }

  .note-body:focus {
    box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--focus-ring);
  }

  .panel.dragging { opacity: .45; }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px 8px;
    cursor: grab;
    user-select: none;
  }

  .panel-grip {
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
    letter-spacing: -1px;
  }

  .panel-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .panel-title[contenteditable="true"] {
    user-select: text;
    cursor: text;
    outline: none;
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 0 4px;
    margin: 0 -4px;
    box-shadow: 0 0 0 1px var(--accent);
  }

  .panel-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .panel-add,
  .panel-del {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .panel-add:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .panel-del:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .add-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  .add-panel-btn {
    min-width: 0;
    height: 64px;
    border: 1.5px dashed var(--input-border);
    border-radius: 14px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color .12s, color .12s, background .12s;
  }

  .add-panel-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  .task-tree {
    list-style: none;
    margin: 0;
    padding: 0 2px;
    flex: 1;
    min-height: 80px;
  }

  .task-tree:empty::after {
    content: "点右上角 ＋ 添加任务";
    display: grid;
    place-items: center;
    min-height: 80px;
    color: var(--muted);
    font-size: 13px;
  }

  .task + .task { margin-top: 2px; }

  .row {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 5px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: grab;
    user-select: none;
  }

  .row:hover { background: var(--panel-hover); }
  .task.dragging > .row { opacity: .35; cursor: grabbing; }

  .collapse-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .collapse-btn:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .collapse-btn::before {
    content: "▸";
    display: block;
    font-size: 14px;
    transition: transform .12s;
  }

  .task:not(.collapsed) > .row > .collapse-btn::before {
    transform: rotate(90deg);
  }

  .collapse-btn:disabled { visibility: hidden; }

  .task.collapsed > .children { display: none; }

  .status-pill {
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
    border: 0;
    border-radius: 999px;
    padding: 0 6px;
    font-size: 11px;
    line-height: 18px;
    font-family: inherit;
    white-space: nowrap;
    cursor: pointer;
  }

  /* 极窄面板（单栏）里压缩行首留白，尽量让标题横向排开 */
  @container (max-width: 200px) {
    .status-pill {
      position: relative;
      width: 16px;
      padding: 0;
      margin-right: 4px;
      font-size: 0;
    }
    .status-pill::after {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 10px;
    }
    .status-pill[data-status="todo"]::after { content: "未"; }
    .status-pill[data-status="doing"]::after { content: "中"; }
    .status-pill[data-status="done"]::after { content: "完"; }

    .row { padding: 6px 4px; gap: 3px; }
    .collapse-btn { width: 14px; }
    .task-title { word-break: keep-all; }
    .panel-head { padding: 0 0 6px; }
  }

  .status-pill[data-status="todo"] { background: var(--pill-todo-bg); color: var(--pill-todo-text); }
  .status-pill[data-status="doing"] { background: var(--pill-doing-bg); color: var(--pill-doing-text); }
  .status-pill[data-status="done"] { background: var(--pill-done-bg); color: var(--pill-done-text); }
  .status-pill:hover { filter: brightness(.95); }

  .main {
    flex: 1;
    min-width: 0;
    padding-top: 3px;
  }

  /* 只有标题行给悬浮按钮让位，正文仍占满整行 */
  .title-line {
    padding-right: 52px;
  }

  /* 窄面板里没有让位空间，标题用满宽度 */
  @container (max-width: 300px) {
    .title-line { padding-right: 0; }
    .panel-head { padding: 0 0 6px; }
  }

  .task-title {
    display: inline;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .task[data-status="done"] > .row .task-title {
    color: var(--done-text);
    text-decoration: line-through;
  }

  .task-content {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .task-content[data-empty="1"] {
    display: none;
    align-items: center;
    min-height: 34px;
    margin: 4px -4px 0;
    padding: 5px 6px;
    border-radius: 6px;
    font-size: 12px;
    opacity: .65;
    cursor: text;
    transition: background .12s;
  }

  .row:hover .task-content[data-empty="1"] { display: flex; }

  .task-content[data-empty="1"]:hover {
    background: var(--panel-hover);
    opacity: .9;
  }

  .task-content[data-empty="1"]::before { content: "点击添加内容"; }

  .task-title[contenteditable="true"] {
    user-select: text;
    cursor: text;
    outline: none;
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 0 4px;
    margin: 0 -4px;
    box-shadow: 0 0 0 1px var(--accent);
  }

  .content-editor {
    display: block;
    width: 100%;
    margin: 4px 0 1px;
    padding: 6px 8px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  /* 悬浮在标题行右侧，不再占用正文宽度 */
  .row-actions {
    position: absolute;
    top: 6px;
    right: 8px;
    display: flex;
    gap: 2px;
    border-radius: 6px;
    background: var(--panel-hover);
    opacity: 0;
    transition: opacity .12s;
  }

  .row:hover .row-actions,
  .row:focus-within .row-actions { opacity: 1; }

  .add-sub,
  .del {
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .add-sub:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .del:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .children {
    list-style: none;
    margin: 0 0 0 16px;
    padding-left: 10px;
    border-left: 1.5px solid var(--border);
  }

  .children:empty { display: none; }

  .composer-row { padding: 4px 8px 6px; }

  .composer {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--panel);
    font: inherit;
    color: var(--text);
    outline: none;
  }

  .composer::placeholder { color: var(--muted); }

  .composer:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .drop-line {
    position: fixed;
    z-index: 30;
    border: 1.5px dashed var(--drop-line);
    border-radius: 14px;
    background: var(--accent-soft);
    opacity: .6;
    pointer-events: none;
  }

  .drop-line.is-row {
    border: 0;
    border-radius: 2px;
    background: var(--drop-line);
    opacity: 1;
  }

  @media (max-width: 900px) {
    .topbar { flex-wrap: wrap; }
    .topbar-actions { padding-top: 0; }
  }

  @media (max-width: 560px) {
    .add-panel { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-text">
      <h1>任务清单</h1>
    </div>
    <div class="topbar-actions">
      <button id="undo-btn" class="ghost-btn" type="button" disabled title="撤销上一步（最多 5 步）">撤销</button>
      <button id="import-btn" class="ghost-btn" type="button" title="从 Markdown 文件导入">导入 MD</button>
      <button id="export-btn" class="ghost-btn" type="button" title="导出为 Markdown 文件">导出 MD</button>
      <button id="theme-btn" class="ghost-btn" type="button">黑暗模式</button>
    </div>
  </header>

  <main class="app">
    <div class="board" id="board">
      <div class="panel-list" id="panel-list"></div>
      <div class="add-panel" id="add-panel">
        <button class="add-panel-btn" id="add-task-panel" type="button">＋ 新建任务面板</button>
        <button class="add-panel-btn" id="add-note-panel" type="button">＋ 新建便签</button>
      </div>
    </div>
  </main>

  <div class="drop-line" id="drop-line" hidden></div>
  <input id="import-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>

  <script>
    const STORAGE_KEY = 'task-board.v5';
    const THEME_KEY = 'task-board.theme';
    const STATUS_LABEL = { todo: '未开始', doing: '执行中', done: '已完成' };
    const STATUS_NEXT = { todo: 'doing', doing: 'done', done: 'todo' };
    const MAX_SUB_LEVELS = 5;
    const MAX_UNDO = 5;

    const boardEl = document.getElementById('board');
    const panelList = document.getElementById('panel-list');
    const addTaskPanelBtn = document.getElementById('add-task-panel');
    const addNotePanelBtn = document.getElementById('add-note-panel');
    const dropLine = document.getElementById('drop-line');
    const undoBtn = document.getElementById('undo-btn');
    const importBtn = document.getElementById('import-btn');
    const exportBtn = document.getElementById('export-btn');
    const importFile = document.getElementById('import-file');
    const themeBtn = document.getElementById('theme-btn');

    const undoStack = [];

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function seedPanels() {
      return [
        {
          id: uid(),
          title: '工作',
          tasks: [{
            id: uid(),
            title: '整理本周工作',
            content: '周五前完成，包含数据汇总和风险项',
            status: 'doing',
            collapsed: false,
            children: [
              { id: uid(), title: '收集各组进度', content: '', status: 'done', collapsed: false, children: [] },
              { id: uid(), title: '汇总风险项', content: '重点关注延期项', status: 'todo', collapsed: false, children: [
                { id: uid(), title: '标注高优风险', content: '', status: 'todo', collapsed: false, children: [] },
              ] },
            ],
          }],
        },
        {
          id: uid(),
          title: '生活',
          tasks: [
            { id: uid(), title: '预约体检', content: '空腹，早上 8:30', status: 'todo', collapsed: false, children: [] },
            { id: uid(), title: '买跑鞋', content: '', status: 'done', collapsed: false, children: [] },
          ],
        },
      ];
    }

    function loadPanels() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (err) {
        saved = null;
      }
      if (!saved || !Array.isArray(saved.panels)) return seedPanels();
      return saved.panels;
    }

    function readTask(li) {
      const children = [];
      for (const child of li.querySelectorAll(':scope > .children > .task')) {
        children.push(readTask(child));
      }
      return {
        id: li.dataset.id,
        title: li.querySelector(':scope > .row > .main > .title-line > .task-title').textContent,
        content: li.querySelector(':scope > .row > .main > .task-content').textContent,
        status: li.dataset.status,
        collapsed: li.dataset.collapsed === '1',
        children,
      };
    }

    function readPanel(panelEl) {
      const layout = {
        id: panelEl.dataset.panelId,
        title: panelEl.querySelector('.panel-title').textContent,
        col: storedCol(panelEl),
        span: storedSpan(panelEl),
        top: Number(panelEl.dataset.top) || 0,
      };
      if (panelEl.dataset.kind === 'note') {
        return {
          ...layout,
          kind: 'note',
          note: panelEl.querySelector('.note-body').value,
          height: Number(panelEl.dataset.height) || 0,
        };
      }
      const tasks = [];
      for (const li of panelEl.querySelectorAll(':scope > .task-tree > .task')) {
        tasks.push(readTask(li));
      }
      return { ...layout, kind: 'tasks', tasks };
    }

    function serialize() {
      const panels = [];
      for (const panelEl of panelList.querySelectorAll(':scope > .panel')) {
        panels.push(readPanel(panelEl));
      }
      return JSON.stringify({ panels });
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, serialize());
    }

    function updateUndoBtn() {
      undoBtn.disabled = undoStack.length === 0;
    }

    function pushUndo(snapshot) {
      undoStack.push(snapshot);
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      updateUndoBtn();
    }

    function undo() {
      const snapshot = undoStack.pop();
      if (!snapshot) return;
      renderPanels(JSON.parse(snapshot).panels);
      persist();
      updateUndoBtn();
    }

    // ---------- 构建 DOM ----------
    function makeTask(task, depth) {
      const li = document.createElement('li');
      li.className = 'task';
      li.dataset.id = task.id;
      li.dataset.status = task.status;
      li.dataset.depth = depth;
      li.dataset.collapsed = task.collapsed ? '1' : '0';
      if (task.collapsed) li.classList.add('collapsed');
      li.draggable = true;

      const row = document.createElement('div');
      row.className = 'row';

      const collapseBtn = document.createElement('button');
      collapseBtn.type = 'button';
      collapseBtn.className = 'collapse-btn';
      collapseBtn.title = '展开/折叠子任务';

      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'status-pill';
      pill.title = '点击切换状态';

      const main = document.createElement('div');
      main.className = 'main';

      const titleLine = document.createElement('div');
      titleLine.className = 'title-line';

      const title = document.createElement('span');
      title.className = 'task-title';
      title.textContent = task.title;

      titleLine.append(pill, title);

      const content = document.createElement('span');
      content.className = 'task-content';
      content.textContent = task.content || '';
      if (!task.content) content.dataset.empty = '1';

      main.append(titleLine, content);

      const actions = document.createElement('div');
      actions.className = 'row-actions';

      if (depth < MAX_SUB_LEVELS) {
        const addSub = document.createElement('button');
        addSub.type = 'button';
        addSub.className = 'add-sub';
        addSub.title = '添加子任务';
        addSub.textContent = '＋';
        actions.appendChild(addSub);
      }

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = '删除任务';
      del.textContent = '×';
      actions.appendChild(del);

      row.append(collapseBtn, main, actions);

      const children = document.createElement('ul');
      children.className = 'children';
      for (const child of task.children || []) {
        children.appendChild(makeTask(child, depth + 1));
      }

      li.append(row, children);
      paintPill(li);
      refreshCollapse(li);
      return li;
    }

    function paintPill(li) {
      const pill = li.querySelector(':scope > .row > .main > .title-line > .status-pill');
      const status = li.dataset.status;
      pill.dataset.status = status;
      pill.textContent = STATUS_LABEL[status];
    }

    function refreshCollapse(li) {
      const btn = li.querySelector(':scope > .row > .collapse-btn');
      const hasChildren = !!li.querySelector(':scope > .children > .task');
      btn.disabled = !hasChildren;
      const collapsed = hasChildren && li.dataset.collapsed === '1';
      li.classList.toggle('collapsed', collapsed);
      btn.setAttribute('aria-expanded', String(hasChildren && !collapsed));
    }

    function makePanel(panelData) {
      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.draggable = true;
      panel.dataset.panelId = panelData.id;
      const kind = panelData.kind === 'note' ? 'note' : 'tasks';
      panel.dataset.kind = kind;
      const hasSpan = Number.isFinite(panelData.span);
      if (hasSpan) {
        if (Number.isFinite(panelData.col)) panel.dataset.col = String(panelData.col);
        panel.dataset.span = String(panelData.span);
      } else if (Number.isFinite(panelData.col)) {
        // 旧版四列数据：列号换算成 12 栏坐标，避免挤在左侧
        panel.dataset.col = String(panelData.col * DEFAULT_SPAN);
        panel.dataset.span = String(DEFAULT_SPAN);
      }
      if (Number.isFinite(panelData.top)) panel.dataset.top = String(panelData.top);
      if (kind === 'note') panel.classList.add('note-panel');

      const head = document.createElement('header');
      head.className = 'panel-head';
      head.innerHTML =
        '<span class="panel-grip" aria-hidden="true">⋮⋮</span>' +
        '<h2 class="panel-title" title="点击重命名"></h2>' +
        '<div class="panel-actions">' +
          (kind === 'tasks' ? '<button class="panel-add" type="button" title="添加任务">＋</button>' : '') +
          '<button class="panel-del" type="button" title="删除面板">×</button>' +
        '</div>';
      head.querySelector('.panel-title').textContent = panelData.title;

      const resizeLeft = document.createElement('div');
      resizeLeft.className = 'panel-resize panel-resize-left';
      resizeLeft.title = '拖动调整面板宽度';

      const resizeRight = document.createElement('div');
      resizeRight.className = 'panel-resize panel-resize-right';
      resizeRight.title = '拖动调整面板宽度';

      panel.append(resizeLeft, resizeRight);

      if (kind === 'note') {
        const body = document.createElement('textarea');
        body.className = 'note-body';
        body.placeholder = '在这里写点什么…';
        body.value = panelData.note || '';
        if (panelData.height > 0) {
          panel.dataset.height = String(panelData.height);
          body.style.height = panelData.height + 'px';
        }
        if (noteResizeObserver) noteResizeObserver.observe(body);

        const resizeBottom = document.createElement('div');
        resizeBottom.className = 'panel-resize-bottom';
        resizeBottom.title = '拖动调整便签高度';

        panel.append(head, body, resizeBottom);
        return panel;
      }

      const tree = document.createElement('ul');
      tree.className = 'task-tree';
      for (const task of panelData.tasks || []) {
        tree.appendChild(makeTask(task, 0));
      }

      panel.append(head, tree);
      return panel;
    }

    function renderPanels(panels) {
      if (noteResizeObserver) noteResizeObserver.disconnect();
      for (const el of panelList.querySelectorAll(':scope > .panel')) el.remove();
      for (const panel of panels) panelList.appendChild(makePanel(panel));

      // 先把带布局信息的定好位，再把缺布局的面板依次补进空位
      layoutPanels();
      for (const el of panelList.querySelectorAll(':scope > .panel:not([data-col])')) {
        autoPlace(el);
        layoutPanels();
      }
      layoutPanels();
    }

    // ---------- 布局：12 栏背景板，面板按「起始栏 + 跨度」摆放 ----------
    const GRID_COLS = 12;
    const DEFAULT_SPAN = 3;
    const MIN_SPAN = 1;
    const PANEL_GAP = 16;
    // 与紧凑位置相差在此范围内才自动吸顶/吸附
    const SNAP_DISTANCE = 48;

    let layoutQueued = false;

    function gridGeometry() {
      const columns = GRID_COLS;
      const total = panelList.clientWidth;
      const colWidth = (total - PANEL_GAP * (columns - 1)) / columns;
      return {
        columns,
        left: panelList.getBoundingClientRect().left,
        colWidth,
        step: colWidth + PANEL_GAP,
      };
    }

    function storedCol(el) {
      const col = Number(el.dataset.col);
      return Number.isFinite(col) ? col : 0;
    }

    function storedSpan(el) {
      const span = Number(el.dataset.span);
      return Number.isFinite(span) ? span : DEFAULT_SPAN;
    }

    function clampSpan(span) {
      return Math.min(Math.max(Math.round(span), MIN_SPAN), GRID_COLS);
    }

    // 跨度不能越出右边栏位，列号优先保持
    function fitToGrid(col, span) {
      const s = clampSpan(span);
      const c = Math.min(Math.max(Math.round(col), 0), GRID_COLS - s);
      return { col: c, span: s };
    }

    function spanWidth(colWidth, span) {
      return span * colWidth + (span - 1) * PANEL_GAP;
    }

    // 在已占用的矩形中找出第一个放得下的纵向位置（被挡就继续往下推）
    function findFreeTop(placed, x0, x1, height) {
      let top = 0;
      for (let guard = 0; guard < 200; guard += 1) {
        const blocking = placed.filter(
          (r) => r.x0 < x1 && r.x1 > x0 && r.y0 < top + height && r.y1 > top
        );
        if (!blocking.length) return top;
        top = Math.max(...blocking.map((r) => r.y1)) + PANEL_GAP;
      }
      return top;
    }

    // 从期望位置开始找不重叠的落点（保留上方空白）
    function resolveTop(placed, x0, x1, height, desired) {
      let top = Math.max(0, desired);
      for (let guard = 0; guard < 200; guard += 1) {
        const blocking = placed.filter(
          (r) => r.x0 < x1 && r.x1 > x0 && r.y0 < top + height && r.y1 > top
        );
        if (!blocking.length) return top;
        top = Math.max(...blocking.map((r) => r.y1)) + PANEL_GAP;
      }
      return top;
    }

    function layoutPanels() {
      const allEls = [...panelList.querySelectorAll(':scope > .panel')];
      if (!allEls.length) {
        panelList.style.height = '';
        return;
      }

      // 还没确定栏位的面板不参与排布，等 autoPlace 分配后再显示
      const panelEls = allEls.filter((el) => el.dataset.col);
      if (!panelEls.length) {
        panelList.style.height = '';
        return;
      }

      const geo = gridGeometry();

      // 先定宽并归一化栏位，再按占用关系纵向摆放
      for (const el of panelEls) {
        const { col, span } = fitToGrid(storedCol(el), storedSpan(el));
        el.dataset.col = String(col);
        el.dataset.span = String(span);
        el.style.width = spanWidth(geo.colWidth, span) + 'px';
        el.style.left = (col * geo.step) + 'px';
      }

      const rects = [];
      for (const el of panelEls) {
        const x0 = storedCol(el) * geo.step;
        const x1 = x0 + el.offsetWidth;
        const height = el.offsetHeight;

        // 紧凑排布位置：当期望位置离它足够近时自动吸过去
        const packed = findFreeTop(rects, x0, x1, height);
        const desired = Number(el.dataset.top);
        let top;
        if (Number.isFinite(desired) && Math.abs(desired - packed) > SNAP_DISTANCE) {
          top = resolveTop(rects, x0, x1, height, desired);
        } else {
          top = packed;
        }

        // 只渲染，不写回期望位置：被挤开是暂时的，窗口变化后能回到原处
        el.style.top = top + 'px';
        el.dataset.renderedTop = String(top);
        rects.push({ x0, x1, y0: top, y1: top + height });
      }

      const bottom = rects.reduce((max, r) => Math.max(max, r.y1), 0);
      panelList.style.height = bottom + 'px';
    }

    // 新面板：在所有栏位里找一个能放得最靠上的位置，同高时靠左
    function autoPlace(panelEl) {
      const geo = gridGeometry();
      const span = clampSpan(storedSpan(panelEl));
      const width = spanWidth(geo.colWidth, span);
      panelEl.style.width = width + 'px';

      // 只统计已定位面板的已排布位置（不是视觉位置，避免被临时挤压影响）
      const rects = [];
      for (const el of panelList.querySelectorAll(':scope > .panel')) {
        if (el === panelEl || !el.dataset.col) continue;
        const col = storedCol(el);
        const top = Number(el.dataset.renderedTop) || 0;
        const x0 = col * geo.step;
        rects.push({ x0, x1: x0 + el.offsetWidth, y0: top, y1: top + el.offsetHeight });
      }

      const height = panelEl.offsetHeight || 160;
      let best = { col: 0, top: Infinity };
      for (let col = 0; col <= GRID_COLS - span; col += 1) {
        const x0 = col * geo.step;
        const top = findFreeTop(rects, x0, x0 + width, height);
        if (top < best.top - 0.5) best = { col, top };
      }
      panelEl.dataset.col = String(best.col);
      panelEl.dataset.span = String(span);
      panelEl.dataset.top = String(best.top);
    }

    function scheduleLayout() {
      if (layoutQueued) return;
      layoutQueued = true;
      requestAnimationFrame(() => {
        layoutQueued = false;
        layoutPanels();
      });
    }

    // 拖拽/调宽时显示 12 栏背景板（纯 CSS 背景，只同步步长变量）
    function setGridActive(active) {
      if (active) {
        panelList.style.setProperty('--grid-step', gridGeometry().step + 'px');
        panelList.classList.add('grid-active');
      } else {
        panelList.classList.remove('grid-active');
      }
    }

    // 便签手动拉伸会改变面板高度，需要跟着重排
    const noteResizeObserver = window.ResizeObserver
      ? new ResizeObserver(() => scheduleLayout())
      : null;

    // ---------- 拖拽边缘调整面板尺寸 ----------
    const MIN_NOTE_HEIGHT = 80;

    function startPanelResize(e, panel, edge) {
      e.preventDefault();
      e.stopPropagation();

      const geo = gridGeometry();
      const startCol = storedCol(panel);
      const startSpan = storedSpan(panel);
      const before = serialize();

      panel.classList.add('resizing');
      document.body.classList.add('panel-resizing');
      setGridActive(true);
      panel.setPointerCapture(e.pointerId);

      const onMove = (ev) => {
        const pointerCol = Math.round((ev.clientX - geo.left) / geo.step);
        if (edge === 'right') {
          // 左边界锁定：只改变跨度，不挪动列号
          const span = Math.min(Math.max(pointerCol - startCol + 1, MIN_SPAN), GRID_COLS - startCol);
          panel.dataset.col = String(startCol);
          panel.dataset.span = String(span);
        } else {
          // 右边界不动，左边界跟着指针吸到栏位
          const rightEdge = startCol + startSpan;
          const leftCol = Math.min(Math.max(pointerCol, 0), rightEdge - MIN_SPAN);
          panel.dataset.col = String(leftCol);
          panel.dataset.span = String(rightEdge - leftCol);
        }
        layoutPanels();
      };

      const finish = () => {
        panel.removeEventListener('pointermove', onMove);
        panel.removeEventListener('pointerup', finish);
        panel.removeEventListener('pointercancel', finish);
        panel.classList.remove('resizing');
        document.body.classList.remove('panel-resizing');
        setGridActive(false);
        if (serialize() !== before) {
          persist();
          pushUndo(before);
        }
        layoutPanels();
      };

      panel.addEventListener('pointermove', onMove);
      panel.addEventListener('pointerup', finish);
      panel.addEventListener('pointercancel', finish);
    }

    function startNoteResize(e, panel) {
      e.preventDefault();
      e.stopPropagation();

      const note = panel.querySelector('.note-body');
      const startY = e.clientY;
      const startHeight = note.getBoundingClientRect().height;
      const before = serialize();

      panel.classList.add('resizing-y');
      document.body.classList.add('panel-resizing-y');
      setGridActive(true);
      panel.setPointerCapture(e.pointerId);

      const onMove = (ev) => {
        const height = Math.max(MIN_NOTE_HEIGHT, Math.round(startHeight + ev.clientY - startY));
        note.style.height = height + 'px';
        panel.dataset.height = String(height);
        layoutPanels();
      };

      const finish = () => {
        panel.removeEventListener('pointermove', onMove);
        panel.removeEventListener('pointerup', finish);
        panel.removeEventListener('pointercancel', finish);
        panel.classList.remove('resizing-y');
        document.body.classList.remove('panel-resizing-y');
        setGridActive(false);
        if (serialize() !== before) {
          persist();
          pushUndo(before);
        }
        layoutPanels();
      };

      panel.addEventListener('pointermove', onMove);
      panel.addEventListener('pointerup', finish);
      panel.addEventListener('pointercancel', finish);
    }

    boardEl.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('.panel-resize');
      if (handle) {
        const panel = handle.closest('.panel');
        startPanelResize(e, panel, handle.classList.contains('panel-resize-left') ? 'left' : 'right');
        return;
      }
      const bottomHandle = e.target.closest('.panel-resize-bottom');
      if (bottomHandle) {
        startNoteResize(e, bottomHandle.closest('.panel'));
      }
    });

    // ---------- 点击操作 ----------
    boardEl.addEventListener('click', (e) => {
      const panelDel = e.target.closest('.panel-del');
      if (panelDel) {
        const before = serialize();
        panelDel.closest('.panel').remove();
        layoutPanels();
        persist();
        pushUndo(before);
        return;
      }

      const panelAdd = e.target.closest('.panel-add');
      if (panelAdd) {
        const panel = panelAdd.closest('.panel');
        openComposer(panel.querySelector(':scope > .task-tree'), 0, null);
        return;
      }

      const collapseBtn = e.target.closest('.collapse-btn');
      if (collapseBtn) {
        const li = collapseBtn.closest('.task');
        if (collapseBtn.disabled) return;
        const before = serialize();
        li.dataset.collapsed = li.dataset.collapsed === '1' ? '0' : '1';
        refreshCollapse(li);
        layoutPanels();
        persist();
        pushUndo(before);
        return;
      }

      const pill = e.target.closest('.status-pill');
      if (pill) {
        const li = pill.closest('.task');
        const before = serialize();
        li.dataset.status = STATUS_NEXT[li.dataset.status];
        paintPill(li);
        persist();
        pushUndo(before);
        return;
      }

      const addSub = e.target.closest('.add-sub');
      if (addSub) {
        const li = addSub.closest('.task');
        openComposer(
          li.querySelector(':scope > .children'),
          Number(li.dataset.depth) + 1,
          li
        );
        return;
      }

      const del = e.target.closest('.del');
      if (del) {
        const li = del.closest('.task');
        const before = serialize();
        const parentLi = li.parentElement.closest('.task');
        li.remove();
        if (parentLi) refreshCollapse(parentLi);
        layoutPanels();
        persist();
        pushUndo(before);
        return;
      }

      // 拖拽刚结束时出现的 click 不触发编辑
      if (Date.now() < editSuppressUntil) return;

      const panelTitle = e.target.closest('.panel-title');
      if (panelTitle && !panelTitle.isContentEditable) {
        editPanelTitle(panelTitle);
        return;
      }

      const contentEl = e.target.closest('.task-content');
      if (contentEl && !contentEl.isContentEditable) {
        editContent(contentEl);
        return;
      }

      const titleEl = e.target.closest('.task-title');
      if (titleEl && !titleEl.isContentEditable) editTitle(titleEl);
    });

    // ---------- 单击编辑 ----------

    function editPanelTitle(textEl) {
      const original = textEl.textContent;
      const before = serialize();
      textEl.contentEditable = 'true';
      textEl.spellcheck = false;
      textEl.focus();

      const range = document.createRange();
      range.selectNodeContents(textEl);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      const finish = (save) => {
        textEl.removeEventListener('keydown', onKey);
        textEl.removeEventListener('blur', onBlur);
        textEl.contentEditable = 'false';

        let next = save ? textEl.textContent.trim() : original;
        if (!next) next = original;
        textEl.textContent = next;

        if (next !== original) {
          persist();
          pushUndo(before);
        }
        layoutPanels();
      };

      const onKey = (ev) => {
        if (ev.isComposing || ev.keyCode === 229) return;
        if (ev.key === 'Enter') {
          ev.preventDefault();
          finish(true);
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          finish(false);
        }
      };

      const onBlur = () => finish(true);

      textEl.addEventListener('keydown', onKey);
      textEl.addEventListener('blur', onBlur);
    }

    function editTitle(textEl) {
      const original = textEl.textContent;
      const before = serialize();
      textEl.contentEditable = 'true';
      textEl.spellcheck = false;
      textEl.focus();

      const range = document.createRange();
      range.selectNodeContents(textEl);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      const finish = (save) => {
        textEl.removeEventListener('keydown', onKey);
        textEl.removeEventListener('blur', onBlur);
        textEl.contentEditable = 'false';

        let next = save ? textEl.textContent.trim() : original;
        if (!next) next = original;
        textEl.textContent = next;

        if (next !== original) {
          persist();
          pushUndo(before);
        }
        layoutPanels();
      };

      const onKey = (ev) => {
        if (ev.isComposing || ev.keyCode === 229) return;
        if (ev.key === 'Enter') {
          ev.preventDefault();
          finish(true);
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          finish(false);
        }
      };

      const onBlur = () => finish(true);

      textEl.addEventListener('keydown', onKey);
      textEl.addEventListener('blur', onBlur);
    }

    const CONTENT_EDITOR_EXTRA_LINES = 2;

    function fitContentEditor(textarea) {
      const style = getComputedStyle(textarea);
      const lineHeight = parseFloat(style.lineHeight) || 19.5;
      const padding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
      // placeholder 会撑大 scrollHeight，测量时先摘掉
      const placeholder = textarea.placeholder;
      textarea.placeholder = '';
      textarea.rows = 1;
      const lines = Math.round((textarea.scrollHeight - padding) / lineHeight);
      textarea.placeholder = placeholder;
      textarea.rows = Math.max(1, lines) + CONTENT_EDITOR_EXTRA_LINES;
    }

    function editContent(contentEl) {
      const original = contentEl.textContent;
      const before = serialize();
      const wasEmpty = contentEl.dataset.empty === '1';

      delete contentEl.dataset.empty;
      contentEl.style.display = 'none';

      const textarea = document.createElement('textarea');
      textarea.className = 'content-editor';
      textarea.rows = 1;
      textarea.value = original;
      textarea.placeholder = '输入任务内容';
      contentEl.after(textarea);
      fitContentEditor(textarea);
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);

      let closed = false;
      const finish = (save) => {
        if (closed) return;
        closed = true;
        const next = save ? textarea.value.trim() : original;
        textarea.remove();
        contentEl.style.display = '';
        contentEl.textContent = next;

        if (next) delete contentEl.dataset.empty;
        else contentEl.dataset.empty = '1';

        if (next !== original || (!next && !wasEmpty)) {
          persist();
          pushUndo(before);
        }
        layoutPanels();
      };

      textarea.addEventListener('blur', () => finish(true));
      textarea.addEventListener('input', () => {
        fitContentEditor(textarea);
        scheduleLayout();
      });
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          finish(false);
        } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          finish(true);
        }
      });
    }

    // ---------- 添加任务 ----------
    function openComposer(container, depth, parentLi) {
      const existing = container.querySelector(':scope > .composer-row');
      if (existing) {
        existing.querySelector('input').focus();
        return;
      }

      const row = document.createElement('li');
      row.className = 'composer-row';

      const input = document.createElement('input');
      input.className = 'composer';
      input.type = 'text';
      input.placeholder = depth === 0 ? '输入任务标题，回车添加' : '输入子任务标题，回车添加';
      input.autocomplete = 'off';

      row.appendChild(input);
      container.appendChild(row);
      input.focus();

      const before = serialize();
      let closed = false;
      const close = (save) => {
        if (closed) return;
        closed = true;
        const title = input.value.trim();
        row.remove();
        if (save && title) {
          container.appendChild(makeTask({
            id: uid(),
            title,
            content: '',
            status: 'todo',
            collapsed: false,
            children: [],
          }, depth));
          // 父级要等子任务挂上后再刷新，否则折叠按钮仍是禁用态
          if (parentLi) {
            parentLi.dataset.collapsed = '0';
            refreshCollapse(parentLi);
          }
          persist();
          pushUndo(before);
        }
        layoutPanels();
      };

      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          close(true);
        } else if (e.key === 'Escape') {
          close(false);
        }
      });
      input.addEventListener('blur', () => close(true));
    }

    // ---------- 便签输入 ----------
    const noteSaveTimers = new WeakMap();

    boardEl.addEventListener('input', (e) => {
      const note = e.target.closest('.note-body');
      if (!note) return;
      scheduleLayout();
      const panel = note.closest('.panel');
      clearTimeout(noteSaveTimers.get(panel));
      noteSaveTimers.set(panel, setTimeout(persist, 400));
    });

    boardEl.addEventListener('change', (e) => {
      const note = e.target.closest('.note-body');
      if (!note) return;
      persist();
      layoutPanels();
    });

    // ---------- 添加面板 ----------
    addTaskPanelBtn.addEventListener('click', () => {
      const before = serialize();
      const panel = makePanel({
        id: uid(),
        kind: 'tasks',
        title: nextPanelTitle('面板'),
        span: DEFAULT_SPAN,
        tasks: [],
      });
      panelList.appendChild(panel);
      panel.dataset.span = String(DEFAULT_SPAN);
      autoPlace(panel);
      layoutPanels();
      persist();
      pushUndo(before);
    });

    addNotePanelBtn.addEventListener('click', () => {
      const before = serialize();
      const panel = makePanel({
        id: uid(),
        kind: 'note',
        title: nextPanelTitle('便签'),
        span: DEFAULT_SPAN,
        note: '',
      });
      panelList.appendChild(panel);
      panel.dataset.span = String(DEFAULT_SPAN);
      autoPlace(panel);
      layoutPanels();
      persist();
      pushUndo(before);
      panel.querySelector('.panel-title').click();
    });

    function nextPanelTitle(prefix) {
      let max = 0;
      for (const el of panelList.querySelectorAll('.panel-title')) {
        const match = new RegExp('^' + prefix + ' (\\d+)$').exec(el.textContent);
        if (match) max = Math.max(max, Number(match[1]));
      }
      return prefix + ' ' + (max + 1);
    }

    // ---------- 拖拽排序（任务同级 / 面板同级） ----------
    let dragKind = null;
    let dragTaskEl = null;
    let dragPanelEl = null;
    let dragSnapshot = null;
    let editSuppressUntil = 0;
    let pendingTaskDrop = null;
    let pendingPanelDrop = null;
    let panelDragArmed = false;
    let dragBlocked = false;
    let dragGrabRatio = 0.5;
    let dragGrabRatioY = 0;

    boardEl.addEventListener('pointerdown', (e) => {
      dragBlocked = !!e.target.closest(
        'button, input, textarea, [contenteditable="true"], .panel-resize, .panel-resize-bottom'
      );
      panelDragArmed = !!e.target.closest('.panel-head') && !dragBlocked;
    });

    boardEl.addEventListener('dragstart', (e) => {
      const taskEl = e.target.closest('.task');
      const panelEl = e.target.closest('.panel');
      const snapshot = serialize();

      if (taskEl && !dragBlocked) {
        dragKind = 'task';
        dragTaskEl = taskEl;
        dragSnapshot = snapshot;
        taskEl.classList.add('dragging');
      } else if (panelEl && panelDragArmed && !dragBlocked) {
        dragKind = 'panel';
        dragPanelEl = panelEl;
        dragSnapshot = snapshot;
        const rect = panelEl.getBoundingClientRect();
        dragGrabRatio = rect.width ? Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1) : 0.5;
        dragGrabRatioY = rect.height ? Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1) : 0;
        panelEl.classList.add('dragging');
      } else {
        e.preventDefault();
        return;
      }

      editSuppressUntil = Date.now() + 300;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      if (dragKind === 'panel') setGridActive(true);
    });

    boardEl.addEventListener('dragover', (e) => {
      if (dragKind === 'task') {
        const container = dragTaskEl.parentElement;
        if (!container.contains(e.target) || dragTaskEl.contains(e.target)) {
          pendingTaskDrop = null;
          hideDropLine();
          return;
        }
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const after = getTaskAfter(container, e.clientY);
        pendingTaskDrop = { container, after };
        showTaskLine(container, after);
        return;
      }

      if (dragKind === 'panel') {
        const drop = resolvePanelDrop(e.clientX, e.clientY);
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        pendingPanelDrop = drop;
        showPanelDropPreview(drop);
      }
    });

    boardEl.addEventListener('dragleave', (e) => {
      if (!dragKind) return;
      if (!boardEl.contains(e.relatedTarget)) {
        pendingTaskDrop = null;
        pendingPanelDrop = null;
        hideDropLine();
      }
    });

    boardEl.addEventListener('drop', (e) => {
      if (!dragKind) return;
      e.preventDefault();

      if (dragKind === 'task' && pendingTaskDrop) {
        const { container, after } = pendingTaskDrop;
        if (after) container.insertBefore(dragTaskEl, after);
        else container.appendChild(dragTaskEl);
      } else if (dragKind === 'panel' && pendingPanelDrop) {
        applyPanelDrop(pendingPanelDrop);
        layoutPanels();
      }
    });

    // 拖到哪一栏就吸附到哪一栏，跨度保持不变
    function applyPanelDrop({ col }) {
      dragPanelEl.dataset.col = String(col);
    }

    boardEl.addEventListener('dragend', () => {
      hideDropLine();
      setGridActive(false);
      if (dragTaskEl) dragTaskEl.classList.remove('dragging');
      if (dragPanelEl) dragPanelEl.classList.remove('dragging');

      if (dragKind && dragSnapshot && serialize() !== dragSnapshot) {
        persist();
        pushUndo(dragSnapshot);
      }

      dragKind = null;
      dragTaskEl = null;
      dragPanelEl = null;
      dragSnapshot = null;
      pendingTaskDrop = null;
      pendingPanelDrop = null;
    });

    function getTaskAfter(container, y) {
      let closest = null;
      let closestOffset = Number.NEGATIVE_INFINITY;
      for (const li of container.querySelectorAll(':scope > .task:not(.dragging)')) {
        const row = li.querySelector(':scope > .row');
        const rect = row.getBoundingClientRect();
        const offset = y - rect.top - rect.height / 2;
        if (offset < 0 && offset > closestOffset) {
          closestOffset = offset;
          closest = li;
        }
      }
      return closest;
    }

    function showTaskLine(container, after) {
      const rect = container.getBoundingClientRect();
      let top;
      if (after) {
        top = after.querySelector(':scope > .row').getBoundingClientRect().top - 2;
      } else {
        const siblings = [...container.querySelectorAll(':scope > .task:not(.dragging)')];
        const last = siblings[siblings.length - 1];
        top = last ? last.getBoundingClientRect().bottom + 1 : rect.top + 6;
      }
      dropLine.className = 'drop-line is-row';
      dropLine.style.left = (rect.left + 4) + 'px';
      dropLine.style.top = top + 'px';
      dropLine.style.width = Math.max(rect.width - 8, 40) + 'px';
      dropLine.style.height = '2px';
      dropLine.hidden = false;
    }

    // 落点预览：目标栏位 + 纵向位置，与最终排布一致
    function showPanelDropPreview({ col, top }) {
      const geo = gridGeometry();
      const span = storedSpan(dragPanelEl);
      dropLine.className = 'drop-line';
      dropLine.style.left = (geo.left + col * geo.step) + 'px';
      dropLine.style.top = (panelList.getBoundingClientRect().top + top) + 'px';
      dropLine.style.width = spanWidth(geo.colWidth, span) + 'px';
      dropLine.style.height = dragPanelEl.offsetHeight + 'px';
      dropLine.hidden = false;
    }

    // 横向吸附到栏位，纵向跟随指针；离紧凑位置近时吸顶
    function resolvePanelDrop(x, y) {
      const geo = gridGeometry();
      const span = storedSpan(dragPanelEl);
      const width = spanWidth(geo.colWidth, span);
      const rawLeft = x - width * dragGrabRatio;
      const { col } = fitToGrid(Math.round((rawLeft - geo.left) / geo.step), span);

      const listTop = panelList.getBoundingClientRect().top;
      const height = dragPanelEl.offsetHeight;
      const rawTop = Math.max(0, Math.round(y - listTop - height * dragGrabRatioY));

      // 用其他面板的占位估算紧凑位置，判断是否吸顶
      const x0 = col * geo.step;
      const x1 = x0 + width;
      const listRect = panelList.getBoundingClientRect();
      const others = [];
      for (const el of panelList.querySelectorAll(':scope > .panel')) {
        if (el === dragPanelEl) continue;
        const r = el.getBoundingClientRect();
        others.push({
          x0: r.left - listRect.left,
          x1: r.right - listRect.left,
          y0: r.top - listRect.top,
          y1: r.bottom - listRect.top,
        });
      }
      const packed = findFreeTop(others, x0, x1, height);
      const top = Math.abs(rawTop - packed) <= SNAP_DISTANCE
        ? packed
        : resolveTop(others, x0, x1, height, rawTop);

      return { col, top };
    }

    // 拖到哪一栏、哪个高度就落在哪
    function applyPanelDrop({ col, top }) {
      dragPanelEl.dataset.col = String(col);
      dragPanelEl.dataset.top = String(top);
    }

    function hideDropLine() {
      dropLine.hidden = true;
    }

    // ---------- Markdown 导入 / 导出 ----------
    function toMarkdown(panels) {
      const lines = [
        '# 任务清单',
        '',
        '<!-- 状态：[ ] 未开始 · [/] 执行中 · [x] 已完成 -->',
        '',
      ];

      const walk = (tasks, depth) => {
        for (const task of tasks) {
          const mark = task.status === 'done' ? 'x' : task.status === 'doing' ? '/' : ' ';
          lines.push('  '.repeat(depth) + '- [' + mark + '] ' + task.title);
          if (task.content) {
            const quoteIndent = '  '.repeat(depth + 1);
            for (const line of task.content.split('\n')) {
              lines.push(quoteIndent + '> ' + line);
            }
          }
          if (task.children && task.children.length) walk(task.children, depth + 1);
        }
      };

      for (const panel of panels) {
        lines.push('## ' + panel.title, '');
        if (panel.kind === 'note') {
          for (const line of String(panel.note || '').split('\n')) {
            lines.push('> ' + line);
          }
        } else {
          walk(panel.tasks || [], 0);
        }
        lines.push('');
      }

      return lines.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd() + '\n';
    }

    function parseMarkdown(text) {
      const panels = [];
      const stack = [];
      let currentPanel = null;
      let currentTask = null;
      let fallbackSeq = 0;

      const ensurePanel = () => {
        if (!currentPanel) {
          fallbackSeq += 1;
          currentPanel = {
            id: uid(),
            kind: 'tasks',
            title: fallbackSeq === 1 ? '导入' : '导入 ' + fallbackSeq,
            tasks: [],
          };
          panels.push(currentPanel);
        }
        return currentPanel;
      };

      for (const raw of text.split(/\r?\n/)) {
        const heading = /^\s*#{2,6}\s+(.+?)\s*$/.exec(raw);
        if (heading) {
          currentPanel = { id: uid(), kind: 'tasks', title: heading[1], tasks: [] };
          panels.push(currentPanel);
          stack.length = 0;
          currentTask = null;
          continue;
        }
        if (/^\s*#\s+/.test(raw)) continue;

        const item = /^(\s*)[-*+]\s+\[([ xX\/])\]\s+(.+?)\s*$/.exec(raw);
        if (item) {
          const panel = ensurePanel();
          const indent = item[1].replace(/\t/g, '    ').length;
          while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
          while (stack.length > MAX_SUB_LEVELS) stack.pop();

          const parent = stack.length ? stack[stack.length - 1].task : null;
          const mark = item[2];
          const status = mark === '/'
            ? 'doing'
            : (mark === 'x' || mark === 'X' ? 'done' : 'todo');
          const task = {
            id: uid(),
            title: item[3],
            content: '',
            status,
            collapsed: false,
            children: [],
          };

          if (parent) parent.children.push(task);
          else panel.tasks.push(task);

          currentTask = task;
          stack.push({ indent, task });
          continue;
        }

        const quote = /^\s*>\s?(.*)$/.exec(raw);
        if (quote && currentTask) {
          currentTask.content = currentTask.content
            ? currentTask.content + '\n' + quote[1]
            : quote[1];
        } else if (quote && currentPanel) {
          currentPanel.note = currentPanel.note
            ? currentPanel.note + '\n' + quote[1]
            : quote[1];
        }
      }

      const trimTask = (task) => {
        task.content = task.content.trim();
        task.children.forEach(trimTask);
      };
      for (const panel of panels) {
        panel.tasks.forEach(trimTask);
        if (panel.note !== undefined) {
          panel.note = panel.note.trim();
          if (!panel.tasks.length) {
            panel.kind = 'note';
            continue;
          }
          panel.note = undefined;
        }
        panel.kind = 'tasks';
      }

      return panels;
    }

    importBtn.addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', async () => {
      const file = importFile.files[0];
      importFile.value = '';
      if (!file) return;

      let text;
      try {
        text = await file.text();
      } catch (err) {
        alert('读取文件失败');
        return;
      }

      const panels = parseMarkdown(text);
      if (!panels.some((panel) => panel.tasks.length || panel.kind === 'note')) {
        alert('文件中没有找到可导入的任务');
        return;
      }
      if (!window.confirm('导入将覆盖当前任务清单，是否继续？')) return;

      const before = serialize();
      renderPanels(panels);
      persist();
      pushUndo(before);
    });

    exportBtn.addEventListener('click', () => {
      const panels = JSON.parse(serialize()).panels;
      const markdown = toMarkdown(panels);
      const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');

      link.href = url;
      link.download = '任务清单-' + now.getFullYear() + pad(now.getMonth() + 1)
        + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.md';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    // ---------- 撤销 / 主题 ----------
    undoBtn.addEventListener('click', undo);

    function paintThemeBtn() {
      themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '明亮模式' : '黑暗模式';
    }

    if (!document.documentElement.dataset.theme) {
      document.documentElement.dataset.theme =
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    paintThemeBtn();

    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem(THEME_KEY, next);
      paintThemeBtn();
    });

    // ---------- 初始化 ----------
    renderPanels(loadPanels());
    persist();
    updateUndoBtn();

    window.addEventListener('resize', scheduleLayout);
    // 字体加载完成后行高可能变化，重排一次
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);
  </script>
</body>
</html>
